name: Deploy Astro site to Pages

on:
  push:
    branches: ['main']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /conflicted
      # Secrets used by scripts/sync/spotify.ts and scripts/sync/backloggd.ts.
      # Set these under repo Settings > Secrets and variables > Actions.
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      BACKLOGGD_PROFILE_ID: ${{ secrets.BACKLOGGD_PROFILE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@10
          # Installs deps, then syncs Spotify/Backloggd data into src/data
          # before `astro build` so it's baked into the static output.
          build-cmd: pnpm run sync && pnpm run build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
